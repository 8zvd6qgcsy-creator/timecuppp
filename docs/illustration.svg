    <circle cx="170" cy="184" r="14" fill="#ffd9a8"/>
    <circle cx="222" cy="198" r="15" fill="#bfe6c8"/>
    <circle cx="266" cy="186" r="12" fill="#ffc9c9"/>
  </g>
  <!-- 高光 -->
  <rect x="88" y="86" width="16" height="120" rx="8" fill="#ffffff" fill-opacity="0.18"/>

  <!-- 右：年度水杯 -->

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="TimeCup 示意图：一杯流动的水，左侧是杯子与漂浮的事件，右侧是一年 365 个小杯子">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#3f6fd8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="cupClip">
      <rect x="60" y="60" width="240" height="260" rx="46"/>
    </clipPath>
  </defs>

  <!-- 左：流动水杯 -->
  <rect x="60" y="60" width="240" height="260" rx="46" fill="url(#glass)" stroke="#9aa3af" stroke-width="3"/>
  <g clip-path="url(#cupClip)">
    <path d="M40 210 C 90 188, 130 232, 180 210 S 270 188, 320 210 L 320 340 L 40 340 Z" fill="url(#water)"/>
    <path d="M40 210 C 90 188, 130 232, 180 210 S 270 188, 320 210" fill="none" stroke="#a8c4ff" stroke-width="3" stroke-opacity="0.85"/>
